[project]
name = "agentfin"
version = "0.2.0"
description = "Agent FinOps: cost attribution and ROI for AI agent spend"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Calas Automations" }]
license = { text = "MIT" }
dependencies = ["click>=8.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
agentfin = "agentfin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentfin*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"agentfin/dashboard.py" = ["E501"]  # inline HTML/CSS template lines
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
